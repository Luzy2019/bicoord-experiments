defaults:
  - task: default_task_14
  - _self_

name: factorized_two_unet_robot_${task.name}
_target_: diffusion_policy.workspace.robotworkspace.RobotWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: ${two_unet_stages.base_stage1.exp_name}

horizon: 12
n_obs_steps: 3
n_action_steps: 10
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: diffusion_policy.policy.factorized_bimanual_two_unet_image_policy.FactorizedBimanualTwoUnetImagePolicy

  shape_meta: ${shape_meta}

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: True
    prediction_type: epsilon

  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${shape_meta}
    rgb_model:
      _target_: diffusion_policy.model.vision.model_getter.get_resnet
      name: resnet18
      weights: null
    resize_shape: null
    crop_shape: null
    random_crop: True
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  obs_as_global_cond: ${obs_as_global_cond}
  diffusion_step_embed_dim: 128
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True
  left_action_dim: 7
  right_action_dim: 7
  left_action_start: 0
  right_action_start: 7
  factorized_hidden_dim: 256
  factorized_gate_init_bias: -2.0
  factorized_aux_loss_weight: 0.25
  speed_modulation_enabled: False
  speed_modulation_strength: 1.0
  speed_modulation_min: 0.5
  speed_modulation_max: 2.0
  speed_modulation_smooth: 3
  speed_modulation_learned: True
  speed_modulation_hidden_dim: 128
  speed_modulation_loss_weight: 1.0e-2
  speed_modulation_target_weight: 1.0
  speed_modulation_smooth_weight: 1.0e-1
  speed_modulation_fast_weight: 1.0e-2
  speed_modulation_risk_weight: 1.0e-1
  speed_modulation_detach_signal: True
  speed_modulation_train_only: False
  speed_modulation_coupling_risk_weight: 1.0
  speed_modulation_geometry_risk_weight: 0.25

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 48
  num_workers: 0
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 48
  num_workers: 0
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 100
  debug: False
  resume: False
  init_ckpt_path: null
  checkpoint_dir_name: null
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 600
  gradient_accumulate_every: 1
  use_ema: True
  freeze_encoder: False
  rollout_every: 50
  checkpoint_every: 50
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: factorized_two_unet_diffusion_policy_debug
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 5
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}

task:
  name: stack_bowls
  dataset:
    zarr_path: data/${task.name}-${setting}-${expert_data_num}.zarr

setting: demo_clean
expert_data_num: 50
head_camera_type: D435

runtime:
  gpu_id: 0

two_unet_stages:
  base_stage1:
    exp_name: ${task.name}-robot_dp-2unet_base_stage1
    training:
      resume: False
      init_ckpt_path: null
      num_epochs: 600
      checkpoint_every: 50
      checkpoint_dir_name: null
    policy:
      speed_modulation_enabled: False
      speed_modulation_learned: True
      speed_modulation_train_only: False
      speed_modulation_loss_weight: 0.0
  speed_stage2:
    exp_name: ${task.name}-robot_dp-2unet_speed_stage2
    training:
      resume: False
      init_ckpt_path: checkpoints/${task.name}-${setting}-${expert_data_num}-${training.seed}/600.ckpt
      num_epochs: 100
      checkpoint_every: 5
      checkpoint_dir_name: ${task.name}-${setting}-${expert_data_num}-${training.seed}-speed
    policy:
      speed_modulation_enabled: True
      speed_modulation_learned: True
      speed_modulation_train_only: True
      speed_modulation_loss_weight: 1.0e-2
