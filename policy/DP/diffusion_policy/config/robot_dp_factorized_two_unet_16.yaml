defaults:
  - robot_dp_16
  - _self_

name: factorized_two_unet_robot_${task.name}

# Keep horizon = n_obs_steps + n_action_steps - 1 so predict_action returns a
# full action chunk from action_pred[:, n_obs_steps-1:].
horizon: 12
n_action_steps: 10

policy:
  _target_: diffusion_policy.policy.factorized_bimanual_two_unet_image_policy.FactorizedBimanualTwoUnetImagePolicy
  left_action_dim: 8
  right_action_dim: 8
  left_action_start: 0
  right_action_start: 8
  factorized_hidden_dim: 256
  factorized_gate_init_bias: -2.0
  factorized_aux_loss_weight: 0.25

speed_modulation:
  _target_: diffusion_policy.policy.speed_modulation.SpeedModulationPolicy
  enabled: False
  strength: 1.0
  min: 0.5
  max: 2.0
  smooth: 3
  learned: True
  hidden_dim: 128
  loss_weight: 1.0e-2
  target_weight: 1.0
  smooth_weight: 1.0e-1
  fast_weight: 1.0e-2
  risk_weight: 1.0e-1
  detach_signal: True
  train_only: False
  coupling_risk_weight: 1.0
  geometry_risk_weight: 0.25

dataloader:
  batch_size: 16

val_dataloader:
  batch_size: 16

logging:
  project: factorized_two_unet_diffusion_policy_debug
